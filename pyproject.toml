[project]
name = "ansimuz-backend"
version = "0.1.1"
description = "Python search, resolution, and artwork backend for ANSImuz"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "requests>=2.28.0",
    "spotifyscraper>=3.0.0",
    "ytmusicapi>=1.12.3",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
