name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "ascii.art"
      - "**/.gitignore"
      - "assets/**"
      - "scripts/**"
      - "website/**"
      - ".github/workflows/web_ci.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "ascii.art"
      - "**/.gitignore"
      - "assets/**"
      - "scripts/**"
      - "website/**"
      - ".github/workflows/web_ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Verify no system yt-dlp binary
        run: "! command -v yt-dlp"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Python syntax check and unit tests
        run: |
          python -m py_compile backend/bridge.py backend/exceptions.py backend/artwork/thumbnails.py backend/providers/spotify/spotify.py backend/providers/ytmusic/ytmusic.py backend/providers/ytdlp/__init__.py backend/providers/ytdlp/errors.py backend/providers/ytdlp/options.py backend/providers/ytdlp/resolver.py backend/providers/ytdlp/runtime.py backend/tests/test_ytdlp.py
          python -m unittest discover -s backend/tests -p "test_*.py" -v

  ci:
    name: Linux Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Verify no system yt-dlp binary
        run: "! command -v yt-dlp"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python syntax check and unit tests
        run: |
          python -m py_compile backend/bridge.py backend/exceptions.py backend/artwork/thumbnails.py backend/providers/spotify/spotify.py backend/providers/ytmusic/ytmusic.py backend/providers/ytdlp/__init__.py backend/providers/ytdlp/errors.py backend/providers/ytdlp/options.py backend/providers/ytdlp/resolver.py backend/providers/ytdlp/runtime.py backend/tests/test_ytdlp.py
          python -m unittest discover -s backend/tests -p "test_*.py" -v
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev mpv libmpv-dev pkg-config

      - name: Set up QuickJS runtime
        run: |
          bash ./scripts/setup_qjs_linux.sh
          ./runtime/qjs --version

      - name: Format check
        run: cargo fmt --check

      - name: Cargo check (both feature sets)
        run: |
          cargo check --all-targets
          cargo check --all-targets --features native-mpv

      - name: Clippy check (both feature sets)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features native-mpv -- -D warnings

      - name: Cargo build (both feature sets)
        run: |
          cargo build --verbose
          cargo build --verbose --features native-mpv

      - name: Run tests (CLI backend)
        run: cargo test --no-default-features --verbose

      - name: Run tests (native, null audio)
        env:
          ANSIMUZ_MPV_AO: "null"
          ANSIMUZ_REQUIRE_MPV: "1"
        run: cargo test --features native-mpv -- --test-threads=1

      - name: Run C bridge tests
        env:
          ANSIMUZ_MPV_AO: "null"
        run: |
          for t in native/mpv/tests/test_*.c; do
            echo "Running $t..."
            gcc -Wall -Inative/mpv/include -Inative/mpv/tests "$t" native/mpv/src/mpv_bridge.c \
              $(pkg-config --cflags --libs mpv) -lm -pthread -o /tmp/bridge_test
            /tmp/bridge_test || exit 1
          done

  windows:
    name: Windows Build & Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up libmpv
        shell: pwsh
        run: |
          ./scripts/setup_mpv_windows.ps1
          Add-Content $env:GITHUB_PATH (Resolve-Path native/mpv/lib).Path

      - name: Set up QuickJS runtime
        shell: pwsh
        run: |
          ./scripts/setup_qjs_windows.ps1
          ./runtime/qjs.exe --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check and unit tests
        run: |
          python -m py_compile backend/bridge.py backend/exceptions.py backend/artwork/thumbnails.py backend/providers/spotify/spotify.py backend/providers/ytmusic/ytmusic.py backend/providers/ytdlp/__init__.py backend/providers/ytdlp/errors.py backend/providers/ytdlp/options.py backend/providers/ytdlp/resolver.py backend/providers/ytdlp/runtime.py backend/tests/test_ytdlp.py
          python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Format check
        run: cargo fmt --check

      - name: Cargo check (both feature sets)
        run: |
          cargo check --all-targets
          cargo check --all-targets --features native-mpv

      - name: Clippy check (both feature sets)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features native-mpv -- -D warnings

      - name: Run tests (CLI backend)
        run: cargo test --no-default-features --verbose

      - name: Run tests (native, null audio)
        env:
          ANSIMUZ_MPV_AO: "null"
          ANSIMUZ_REQUIRE_MPV: "1"
        run: cargo test --features native-mpv -- --test-threads=1

      - name: Release build (native)
        run: cargo build --release --features native-mpv
