[package]
name = "ansimuz"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
image = "0.25.10"
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
