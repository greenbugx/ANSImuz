[package]
name = "ansimuz"
version = "0.1.2"
edition = "2024"
description = "A lightweight fast TUI to stream your favourite music with pure 8-bit ANSI vibes."
license = "MIT"

[dependencies]
crossterm = "0.29.0"
image = "0.25.10"
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.3"
